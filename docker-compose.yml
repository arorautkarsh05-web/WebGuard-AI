services:
  db:
    image: postgres:16-alpine
    container_name: webguard-db
    restart: always
    environment:
      POSTGRES_DB: webguard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: webguard-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: webguard-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/webguard
      REDIS_URL: redis://redis:6379/0
      TINYFISH_API_KEY: ${TINYFISH_API_KEY}
      SECRET_KEY: ${SECRET_KEY:-webguard-super-secret-key-change-in-production-2026}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: webguard-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:

